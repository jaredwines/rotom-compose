name: palworld-jared

services:
  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    container_name: palworld-server-jared
    restart: unless-stopped
    ports:
      - "8211:8211/udp"
      - "27015:27015/udp"
    env_file:
      - /srv/rotom/secrets/game-servers/palworld-jared.env
    environment:
      PUID: 995
      PGID: 5001
      TZ: "America/Los_Angeles"
      MULTITHREADING: "true"
      COMMUNITY: "false"
      SERVER_NAME: "Jared's Palworld Server"
      SERVER_DESCRIPTION: "Palworld Dedicated Server"
      PORT: 8211
      PLAYERS: 16
      BASE_CAMP_MAX_NUM_IN_GUILD: 10
      BASE_CAMP_WORKER_MAX_NUM: 20
      ENABLE_INVADER_ENEMY: "false"
      BUILD_OBJECT_DETERIORATION_DAMAGE_RATE: "0"
      DEATH_PENALTY: None
      BLOCK_RESPAWN_TIME: 0.01
      RESPAWN_PENALTY_DURATION_THRESHOLD: 0.01
      RESPAWN_PENALTY_TIME_SCALE: 0.01
      BACKUP_ENABLED: "true"
      DELETE_OLD_BACKUPS: "true"
      OLD_BACKUP_DAYS: 30
      AUTO_UPDATE_ENABLED: "true"
      AUTO_UPDATE_CRON_EXPRESSION: "0 2 * * *"
      AUTO_UPDATE_WARN_MINUTES: 30
      UPDATE_ON_BOOT: "true"
      RCON_ENABLED: "true"
    volumes:
      - /srv/rotom/appdata/game-servers/palworld-jared:/palworld
    stop_grace_period: 30s
