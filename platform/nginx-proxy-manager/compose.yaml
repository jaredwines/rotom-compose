services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    network_mode: host
    dns:
      - 192.168.1.1
    volumes:
      - /srv/rotom/appdata/platform/nginx-proxy-manager/data:/data
      - /srv/rotom/appdata/platform/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
      - type: bind
        source: /mnt/nas-libraries/games
        target: /mnt/nas-libraries/library/games
        read_only: true
        bind:
          create_host_path: false
