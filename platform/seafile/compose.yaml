services:
  seafile-db:
    image: mariadb:10.11
    container_name: seafile-db
    restart: "no"
    env_file:
      - /srv/rotom/secrets/platform/seafile/seafile.env
    environment:
      MYSQL_LOG_CONSOLE: "true"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - type: bind
        source: /srv/rotom/appdata/platform/seafile/database
        target: /var/lib/mysql
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  seafile-redis:
    image: redis:7.4-alpine
    container_name: seafile-redis
    restart: "no"
    env_file:
      - /srv/rotom/secrets/platform/seafile/seafile.env
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save \"\" --appendonly no"]

  seafile:
    image: seafileltd/seafile-mc:14.0.9
    container_name: seafile
    restart: "no"
    env_file:
      - /srv/rotom/secrets/platform/seafile/seafile.env
    environment:
      SEAFILE_MYSQL_DB_HOST: seafile-db
      SEAFILE_MYSQL_DB_PORT: "3306"
      SEAFILE_MYSQL_DB_USER: seafile
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      TIME_ZONE: America/Los_Angeles
      SEAFILE_SERVER_HOSTNAME: cloud.rotom.casa
      SEAFILE_SERVER_PROTOCOL: https
      CSRF_TRUSTED_ORIGINS: https://cloud.rotom.casa
      CACHE_PROVIDER: redis
      REDIS_HOST: seafile-redis
      REDIS_PORT: "6379"
      ENABLE_GO_FILESERVER: "true"
      ENABLE_SEADOC: "false"
      ENABLE_SEAFDAV: "false"
      ENABLE_NOTIFICATION_SERVER: "false"
      ENABLE_SEAFILE_AI: "false"
      ENABLE_METADATA_MANAGEMENT: "false"
    ports:
      - "127.0.0.1:8800:80"
    volumes:
      - type: bind
        source: /srv/rotom/appdata/platform/seafile/shared
        target: /shared
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/nas-cloud/seafile-data
        target: /shared/seafile/seafile-data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      seafile-db:
        condition: service_healthy
      seafile-redis:
        condition: service_started
