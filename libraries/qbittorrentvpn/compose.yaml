services:
  qbittorrentvpn:
    image: binhex/arch-qbittorrentvpn:latest
    container_name: qbittorrentvpn
    restart: unless-stopped
    env_file:
      - /srv/rotom/secrets/libraries/qbittorrentvpn.env
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=127
      - PGID=5000
      - UMASK=002
      - TZ=America/Los_Angeles
      - VPN_ENABLED=yes
      - VPN_PROV=protonvpn
      - VPN_CLIENT=wireguard
      - LAN_NETWORK=192.168.1.0/24
      - ENABLE_PRIVOXY=no
      - ENABLE_SOCKS=no
      - STRICT_PORT_FORWARD=yes
      - USERSPACE_WIREGUARD=no
      - NAME_SERVERS=1.1.1.1,1.0.0.1
      - WEBUI_PORT=8080
    volumes:
      - /srv/rotom/appdata/libraries/qbittorrentvpn/config:/config
      - type: bind
        source: /mnt/nas-libraries/torrents
        target: /media/torrents
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/nas-libraries/.rotom-qbt-media-ready
        target: /run/rotom-nas-library
        read_only: true
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "192.168.1.69:8080:8080"
    networks:
      default: {}

