services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=127
      - PGID=5000
      - TZ=America/Los_Angeles
      - UMASK=002
    volumes:
      - /srv/rotom/appdata/libraries/radarr/config:/config
      - /mnt/nas-libraries:/media
      - type: bind
        source: /mnt/nas-libraries/torrents
        target: /media/torrents
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "7878:7878"
    networks:
      default: {}

