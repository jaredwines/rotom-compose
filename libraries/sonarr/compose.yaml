services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=127
      - PGID=5000
      - TZ=America/Los_Angeles
      - UMASK=002
    volumes:
      - /srv/rotom/appdata/libraries/sonarr/config:/config
      - /mnt/nas-libraries:/media
      - type: bind
        source: /mnt/nas-libraries/torrents
        target: /media/torrents
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8989:8989"
    networks:
      default: {}

